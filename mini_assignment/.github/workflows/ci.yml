name: Python Tests

on:
  workflow_dispatch:
    inputs:
      result:
        description: "Choose the result to demonstrate"
        required: true
        type: choice
        options:
          - pass
          - fail

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -vv

      - name: Demonstrate failure
        if: inputs.result == 'fail'
        run: exit 1