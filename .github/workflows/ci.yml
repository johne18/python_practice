name: Python Tests and Docker

on:
  workflow_dispatch:
    inputs:
      result:
        description: "Choose the result to demonstrate"
        required: true
        type: choice
        options:
          - pass
          - fail

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mini_assignment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run passing tests
        if: inputs.result == 'pass'
        run: python -m pytest -vv ./mini_assignment/test_app.py

      - name: Run intentional failing test
        if: inputs.result == 'fail'
        shell: bash
        run: |
          python -m pytest -vv ./mini_assignment/test_app_failure.py

      - name: Build Docker image
        run: docker build -t mini-assignment:test .
