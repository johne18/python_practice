name: Python Tests and Docker

on:
  workflow_dispatch:
    inputs:
      result:
        description: "Choose pass or fail job"
        required: true
        type: choice
        options:
          - pass
          - fail

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mini_assignment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run passing tests
        if: inputs.result == 'pass'
        run: python -m pytest -vv ./test_app.py

      - name: Run intentional failing test
        if: inputs.result == 'fail'
        shell: bash
        run: |
          python -m pytest -vv ./test_app_failure.py

      - name: Read application version
        id: version
        run: |
          VERSION=$(python -c "from __version__ import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Build Docker image
        run: docker build -t mini-assignment:${{ steps.version.outputs.version }} .

      - name: Show image version
        run: docker image inspect mini-assignment:${{ steps.version.outputs.version }}